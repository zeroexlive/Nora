name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: macos-arm64
            os: macos-latest
          - name: windows-x86_64
            os: windows-2022
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libgl1-mesa-dev
      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build -A x64 -DNORA_BUILD_GUI=ON
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNORA_BUILD_GUI=ON
          fi
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: bash
        run: |
          PKG="nora-${TAG}-${{ matrix.name }}"
          mkdir -p "dist/$PKG"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp build/Release/nora-cli.exe build/Release/nora.exe "dist/$PKG/"
          else
            cp build/nora-cli build/nora "dist/$PKG/"
          fi
          cp -r README.md LICENSE examples scenes "dist/$PKG/"
          cp third_party/obj/LICENSE "dist/$PKG/LICENSE.obj"
          mkdir -p "dist/$PKG/renders" && cp renders/*.png "dist/$PKG/renders/" || true
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$PKG.zip" "$PKG" > /dev/null
          else
            tar czf "$PKG.tar.gz" "$PKG"
          fi
          rm -rf "$PKG"
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: nora-${{ matrix.name }}
          path: dist/*

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Nora ${{ env.TAG }}
          body: |
            Nora ${{ env.TAG }}: a physically based renderer with Metropolis light transport (PSSMLT over a path tracer with NEE), RGB and spectral (hero wavelength) modes, a built-in OSL-subset compiler, a node shader editor and a CUI GUI.

            Binaries: `nora` (GUI) and `nora-cli` for Linux x86_64, macOS arm64 and Windows x86_64. Verify downloads with `SHA256SUMS.txt`.
            See the README for usage, the OSL coverage and the roadmap (MMLT/BDPT is not in this release).
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
